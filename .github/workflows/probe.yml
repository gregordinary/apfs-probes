name: probe
run-name: ${{ inputs.probe }} ${{ inputs.args }}

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Probe to run, a script under probe/ without its .sh
        required: true
        default: discover
      runners:
        description: JSON list of runner labels
        required: true
        default: '["macos-15", "macos-26", "xcode-27"]'
      args:
        description: Arguments for the probe after its output directory
        required: false
        default: ''
      minutes:
        description: Minutes the probe may run
        required: false
        default: '35'

permissions:
  contents: read

jobs:
  probe:
    name: ${{ inputs.probe }} on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Run the probe
        timeout-minutes: ${{ fromJSON(inputs.minutes) }}
        env:
          PROBE: ${{ inputs.probe }}
          ARGS: ${{ inputs.args }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          [[ $PROBE =~ ^[a-z0-9-]+$ && -f probe/$PROBE.sh ]] || { echo "no probe named $PROBE"; exit 1; }
          [[ $ARGS =~ ^[a-z0-9/\ -]*$ ]] || { echo "arguments may hold only a-z, 0-9, /, - and spaces"; exit 1; }
          bash "probe/$PROBE.sh" out $ARGS

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.probe }}-${{ matrix.runner }}
          path: out/
          retention-days: 7
          if-no-files-found: error
